# Plif's machine-readable configuration reference.
#
# The canonical user file is ~/.plif/config.toml. This document is TOML too so
# agents and people can inspect the supported shape without translating from a
# JSON-only vocabulary. It is a reference catalogue, not a JSON Schema dialect.

title = "Plif configuration"
format = "TOML"
schemaVersion = 1
configFile = "~/.plif/config.toml"
additionalFields = true

[fields."$schema"]
type = "string"
description = "URL of this TOML configuration reference; Plif adds it when saving."

[fields.model]
type = "string"
format = "provider/model"
description = "Primary model. An image-capable primary model can inspect images directly."

[fields.projectRoot]
type = "string"
format = "directory"
description = "Default local projects folder used when launching PLIF outside an existing project."

[fields.visionModel]
type = "string"
format = "provider/model"
description = "Image-capable helper used by text-only models through inspect_image."

[fields.theme]
type = "string"
description = "Built-in theme id or an id from ~/.plif/*.theme."

[fields.small_model]
type = "string"
format = "provider/model"
description = "Optional smaller model used for lightweight work."

[fields.permissionMode]
type = "string"
values = ["ask", "auto-approve", "deny"]

[fields.autoApprove]
type = "boolean"
deprecatedBy = "permissionMode"

[fields.effort]
type = "string"
values = ["low", "medium", "high", "xhigh", "max", "ultra", "ultracode", "plif"]

[fields.toolMode]
type = "string"
values = ["native", "code", "both"]
description = "How tools reach the model. native sends every schema each request; code sends only run_code and moves the catalogue into the cacheable system prefix, where the model calls tools from inside a sandboxed program; both ships each and lets the model choose. Overridden by PLIF_TOOLS_MODE."

[fields.codexFast]
type = "boolean"
description = "Use Codex's higher-speed service tier; applies only to the Codex provider."

[fields.conversationState]
type = "string"
values = ["auto", "native", "replay"]
description = "Conversation continuation policy. Auto uses native provider state with transcript replay fallback."

[fields.temperature]
type = "number"

[fields.maxTokens]
type = "integer"
minimum = 1

[fields.plif]
type = "table"
description = "Plif-only review, adversarial-review, skill-harvest, and reminder settings."

[fields."plif.maxGoalRounds"]
type = "integer"
minimum = 1
description = "Maximum autonomous goal rounds for the Plif effort."

[fields."plif.runScriptMaxSteps"]
type = "integer"
minimum = 1
description = "Maximum sequential tool steps allowed by run_script."

[fields."plif.continuableSubagents"]
type = "boolean"
description = "Persist subagent sessions so they can receive follow-up messages."

[fields.timeoutMs]
type = "integer"
minimum = 1

[fields.provider]
type = "table"
values = "Map of provider ids to provider definitions."

[fields.providers]
type = "table"
aliasOf = "provider"

[fields.agent]
type = "table"
values = "Map of agent names to agent definitions."

[fields.agentAutoLaunch]
type = "boolean"
description = "Allow the primary agent to launch configured named agents when their role matches a task."

[fields.activityHud]
type = "table"
description = "Presentation preference for the runtime Activity HUD."

[fields."activityHud.mode"]
type = "string"
values = ["closed", "compact", "expanded"]
description = "Persisted HUD view mode; compact is the default."

[fields.profiles]
type = "table"

[fields.mcp]
type = "table-or-array"
description = "MCP servers. Command servers use command/args; remote servers use url/headers."

[fields.mcpServers]
type = "table-or-array"
aliasOf = "mcp"

[fields.baseURL]
type = "string"
format = "uri"
description = "Legacy single-provider API endpoint."

[fields.preset]
type = "string"
description = "Legacy provider preset."

[fields.apiKey]
type = "string"
sensitive = true
readOnlyLegacy = true
description = "Legacy import-only API credential. Canonical writes remove it after encrypted-store migration."

[fields.needKey]
type = "boolean"

[fields.NeedKey]
type = "boolean"
aliasOf = "needKey"

[definitions.provider]
type = "table"
additionalFields = true

[definitions.provider.fields.name]
type = "string"

[definitions.provider.fields.sdk]
type = "string"
values = ["openai"]

[definitions.provider.fields.npm]
type = "string"

[definitions.provider.fields.options]
type = "table"
description = "Provider options such as baseURL and whether a credential is required."

[definitions.provider.fields.models]
type = "table"
values = "Map of model ids to model definitions."

[definitions.model]
type = "table"
additionalFields = true

[definitions.model.fields.name]
type = "string"

[definitions.model.fields.contextWindow]
type = "integer"
minimum = 1

[definitions.model.fields.modalities]
type = "array"
values = ["text", "image"]
description = "Declare image only when the model accepts image input directly."

[definitions.model.fields.cost]
type = "string"
values = ["free", "paid", "unknown"]

[definitions.model.fields.needKey]
type = "boolean"

[definitions.agent]
type = "table"
additionalFields = true

[definitions.agent.fields.model]
type = "string"
format = "provider/model"

[definitions.agent.fields.description]
type = "string"

[definitions.agent.fields.instructions]
type = "string"
description = "Optional role instructions used when this named agent runs."

[definitions.agent.fields.maxIterations]
type = "integer"
minimum = 1

[definitions.agent.fields.disable]
type = "boolean"

[definitions.hooks]
description = """
Commands plif runs at fixed points in the loop. Written as a list of tables:

  [[hooks]]
  event = "tool.before"
  match = "^(write_file|edit_file|apply_patch)$"
  name = "protect vendored code"
  command = "if grep -q vendor/ <<< \"$PLIF_HOOK_SUBJECT\"; then echo 'vendored' >&2; exit 2; fi"

A hook is a command, not a JavaScript module, and it runs through the same
container, path jail, policy engine and audit log as every tool. Installing one
cannot grant more privilege than the model already has.

The event arrives as PLIF_HOOK_EVENT and PLIF_HOOK_SUBJECT, and as JSON on
stdin. The exit code is the answer: 0 allows and sends stdout to the model, 2
blocks with stderr as the reason, anything else is reported as a failed hook
while the action proceeds.

Only tool.before can block; the others have nothing left to stop.

Because a hook is an ordinary command, the policy engine reviews it like any
other: under permission mode "ask" every hook run asks for approval, which for
a lint-on-every-edit hook is not what you want. Run /permissions auto-approve
if hooks should run unattended. That is deliberate — hooks are not silently
exempt from the approval model.
"""
type = "array"

[definitions.hooks.fields.event]
type = "string"
enum = ["tool.before", "tool.after", "user.prompt", "turn.end", "session.start", "session.end"]

[definitions.hooks.fields.command]
type = "string"
description = "The script to run, in this machine's shell dialect."

[definitions.hooks.fields.match]
type = "string"
description = "Regular expression the tool name (or prompt) must match. Anchor it for an exact name."

[definitions.hooks.fields.name]
type = "string"
description = "Shown in the timeline and audit log instead of the raw command."

[definitions.hooks.fields.timeoutMs]
type = "integer"
minimum = 1
description = "Defaults to 30000. A hook sits on the critical path of a tool call."

[examples.directVision]
description = "The primary model receives text and image inputs itself."
model = "custom/vision-primary"
modalities = ["text", "image"]

[examples.delegatedVision]
description = "A text-only primary calls inspect_image, which delegates to visionModel."
model = "custom/text-primary"
visionModel = "custom/vision-helper"
primaryModalities = ["text"]
helperModalities = ["text", "image"]
