name: release

# npm is what the installer pulls from, so a release is an npm publish first
# and a GitHub release second. An npm version can never be republished, which
# is why the tests gate the publish rather than following it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch or commit used for validation and packaging'
        required: true
        default: 'main'
        type: string
      release_ref:
        description: 'Existing tag to publish'
        required: true
        default: 'v0.3.9'
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - run: npm ci
      - name: Test Linux sandbox backend
        if: runner.os == 'Linux'
        run: node --import tsx --test packages/sandbox/test/linux-backend.test.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the TTY surface
        run: node packages/cli/dev/smoke-tui.mjs
      - run: npm pack --workspace @plif/cli --dry-run

  release:
    needs: validate
    # Publish only after both supported operating-system validations pass.
    # The release job remains Windows because npm provenance and the existing
    # release path are already exercised there; the matrix above proves the
    # package/build and Linux sandbox path independently before publishing.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check the tag matches the version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_ref || github.ref_name }}
        run: |
          $tag = ($env:RELEASE_TAG -replace '^refs/tags/', '' -replace '^v', '')
          $version = (Get-Content packages/cli/package.json | ConvertFrom-Json).version
          if ($tag -ne $version) {
            throw "tag v$tag does not match packages/cli/package.json version $version"
          }

      # Dependency order: sandbox, then core which needs it, then the CLI.
      - name: Publish to npm
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            @{ Workspace = '@plif/sandbox'; Package = '@plif/sandbox'; Manifest = 'packages/sandbox/package.json' },
            @{ Workspace = '@plif/core'; Package = '@plif/core'; Manifest = 'packages/core/package.json' },
            @{ Workspace = '@plif/cli'; Package = '@plif/cli'; Manifest = 'packages/cli/package.json' }
          )

          foreach ($target in $targets) {
            $version = (Get-Content $target.Manifest | ConvertFrom-Json).version
            $published = (npm view "$($target.Package)@$version" version 2>$null | Out-String).Trim()
            if ($LASTEXITCODE -eq 0 -and $published -eq $version) {
              Write-Host "$($target.Package)@$version is already published; skipping."
              continue
            }

            npm publish --workspace $target.Workspace --access public --provenance
            if ($LASTEXITCODE -ne 0) {
              throw "npm publish failed for $($target.Package)@$version"
            }
          }

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_ref || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "GitHub release $env:RELEASE_TAG already exists; leaving it unchanged."
          } else {
            gh release create $env:RELEASE_TAG `
              --title "plif $env:RELEASE_TAG" `
              --generate-notes `
              --verify-tag
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed for $env:RELEASE_TAG"
            }
          }
