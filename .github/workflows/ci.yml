name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - if: runner.os == 'Linux'
        run: node --import tsx --test packages/sandbox/test/linux-backend.test.ts
      - run: npm run typecheck
      - if: runner.os == 'Linux'
        name: Run Linux tests with failure annotations
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee npm-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *"✖"*|*"fail"*|*"Error"*|*"error"*) echo "::error title=Linux test failure::$line" ;;
              esac
            done < npm-test.log
          fi
          exit "$status"
      - if: runner.os != 'Linux'
        run: npm test
