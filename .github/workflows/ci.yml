name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - if: runner.os == 'Linux'
        name: Enable Linux user namespaces for Bubblewrap
        run: |
          echo "kernel.apparmor_restrict_unprivileged_userns = 0" | sudo tee /etc/sysctl.d/99-plif-userns.conf
          sudo sysctl --system
      - run: npm ci
      - if: runner.os == 'Linux'
        run: PLIF_REQUIRE_LINUX_SANDBOX=1 node --import tsx --test packages/sandbox/test/linux-backend.test.ts
      - run: npm run typecheck
      - run: npm test
